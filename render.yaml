services:
  - type: web
    name: mindpal-ai-gateway
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Set this in the Render dashboard. NEVER commit the real key.
      - key: GEMINI_API_KEY
        sync: false
      # Verify against the current model list before first deploy.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite,gemini-3-flash-preview
      # Your Vercel URL, e.g. https://mindpal.vercel.app
      # Comma-separated for several. "*" is allowed for a quick demo.
      - key: ALLOWED_ORIGIN
        sync: false
      - key: MAX_REQUESTS_PER_MINUTE
        value: "20"
      - key: REQUEST_TIMEOUT_MS
        value: "12000"
      - key: NODE_VERSION
        value: "22"
