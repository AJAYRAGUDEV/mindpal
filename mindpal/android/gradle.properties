# Gradle daemon memory.
#
# The Flutter template ships -Xmx8G -XX:MaxMetaspaceSize=4G, which assumes a
# 16-32 GB developer machine. This one has ~6 GB of RAM, so the daemon JVM
# could not start at all — and a daemon that fails to launch shows up as the
# confusing "java.io.IOException: Unable to establish loopback connection",
# which looks like a networking fault rather than a memory one.
#
# 1.5 GB is enough for an Android build of this size. If you ever hit a real
# OutOfMemoryError, raise it — but close Chrome first, since the browser is
# usually what leaves this machine with under a gigabyte free.
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Building on this machine: the Gradle daemon needs JAVA_TOOL_OPTIONS.
#
# On Windows, Java 16+ implements its internal Pipe (behind every
# Selector.open()) over a Unix-domain socket created in the temp folder. This
# user's temp folder is under "C:/Users/KARTHIKA RAGUNATHAN", and the space
# makes that connect fail with "Invalid argument". The daemon then dies the
# instant a client sends it a build, which the client reports as the baffling
# "A new daemon was started but could not be connected to".
#
# The fix is -Djdk.net.unixdomain.tmpdir=C:/gtmp (any existing directory with
# no spaces). It CANNOT go in org.gradle.jvmargs above: Gradle treats -D
# entries there as mutable system properties and applies them to the daemon
# after connecting, which is after the pipe has already failed. It has to
# reach the daemon JVM on its command line, and the only thing that does that
# is the environment variable every JVM reads at startup:
#
#   setx JAVA_TOOL_OPTIONS "-Djdk.net.unixdomain.tmpdir=C:\gtmp"
#
# Run once, open a new terminal. Other machines do not need this.

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
